[project]
name = "vector_lake"
version = "0.0.5"
description = "S3 vector database for bigdata"
readme = "Readme.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
keywords = ["vector", "database", "bigdata"]
authors = [{ name = "Alexander Miasoiedov", email = "msoedov@gmail.com" }]
maintainers = [{ name = "Alexander Miasoiedov", email = "msoedov@gmail.com" }]
dependencies = [
    "fire>=0.7.1,<0.8.0",
    "loguru>=0.7.3,<0.8.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "pyarrow>=23.0.0,<24.0.0",
    "pydantic>=1.10.24,<2.0.0",
    "pytz>=2025.2",
    "scikit-learn>=1.8.0,<2.0.0",
]
urls = { "Repository" = "https://github.com/msoedov/vector_lake" }

[project.optional-dependencies]
s3 = ["boto3>=1.42.0,<2.0.0"]
dev = [
    "black>=26.1.0,<27.0.0",
    "mypy>=1.19.0,<2.0.0",
    "httpx>=0.28.0,<0.29.0",
    "pytest>=9.0.0,<10.0.0",
    "types-requests>=2.32.0,<3.0.0",
    "pre-commit>=4.5.0,<5.0.0",
    "hypothesis>=6.151.0,<7.0.0",
    "pytest-benchmark==4.0.0",
]

[project.scripts]
vector_lake = "vector_lake.__main__:entrypoint"


[tool.poetry]
name = "vector_lake"
version = "0.0.5"
description = "S3 vector database for bigdata"
authors = ["Alexander Miasoiedov <msoedov@gmail.com>"]
maintainers = ["Alexander Miasoiedov <msoedov@gmail.com>"]
repository = "https://github.com/msoedov/vector_lake"
license = "MIT"
readme = "Readme.md"
keywords = ["vector", "database", "bigdata"]
packages = [{ include = "vector_lake", from = "." }]


[tool.poetry.scripts]
vector_lake = "vector_lake.__main__:entrypoint"

[tool.poetry.dependencies]
python = "^3.11"
fire = "^0.7.1"
loguru = "^0.7.3"
numpy = "^2.0.0"
pandas = "^3.0.0"
pyarrow = "^23.0.0"
pydantic = "^1.10.24"
pytz = "^2025.2"
scikit-learn = "^1.8.0"
boto3 = { version = "^1.42.0", optional = true }

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
mypy = "^1.19.0"
httpx = "^0.28.0"
pytest = "^9.0.0"
types-requests = "^2.32.0"
pre-commit = "^4.5.0"
hypothesis = "^6.151.0"
pytest-benchmark = "4.0.0"

[tool.poetry.extras]
s3 = ["boto3"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
